networks:
  qa-network:
    name: qa-network
    driver: bridge

# Создаем изолированный виртуальный диск для видеофайлов
volumes:
  video-data:
    name: video-data

services:
  selenoid:
    image: aerokube/selenoid:latest-release
    networks:
      - qa-network
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./selenoid:/etc/selenoid:ro"
      - "video-data:/opt/selenoid/video"
    ports:
      - "4444:4444"
    environment:
      - DOCKER_API_VERSION=1.41
      - OVERRIDE_VIDEO_OUTPUT_DIR=video-data
    command: ["-conf", "/etc/selenoid/browsers.json", "-video-output-dir", "/opt/selenoid/video", "-container-network", "qa-network"]

  qa-framework:
    build: .
    depends_on:
      - selenoid
    networks:
      - qa-network
    volumes:
      - "./allure-results:/app/allure-results"
      - "video-data:/app/video"
    environment:
      - USE_SELENOID=true
      - SELENOID_HUB_URL=http://selenoid:4444/wd/hub
      - VIDEO_DIR=/app/video
      - BROWSER=${BROWSER:-chrome}
      - TEST_MARKER=${TEST_MARKER:-}
      - USER_EMAIL=${USER_EMAIL}
      - USER_PASSWORD=${USER_PASSWORD}
      - UI_BASE_URL=https://icarro-v1.netlify.app
      - API_BASE_URL=https://ilcarro-backend.herokuapp.com
    # 👇 Читаем BROWSER снаружи. Если его нет, по умолчанию берем chrome
    # 👇 Если передан TEST_MARKER — фильтруем по нему, иначе запускаем все тесты
    command: >
      sh -c '
      if [ -n "$$TEST_MARKER" ]; then
        pytest tests/ -n 3 -m "$$TEST_MARKER" --browser_name=$${BROWSER:-chrome} --video=on --clean-alluredir --alluredir=allure-results;
      else
        pytest tests/ -n 3 --browser_name=$${BROWSER:-chrome} --video=on --clean-alluredir --alluredir=allure-results;
      fi
      '