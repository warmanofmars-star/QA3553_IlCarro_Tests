# Тестовый стенд: Selenium Grid 4 (хаб + узлы браузеров) и контейнер с тестами.
#
# Браузер выбирается ДВУМЯ переменными с одинаковым значением:
#   COMPOSE_PROFILES — какие узлы браузеров запустить (у каждого узла свой профиль);
#   BROWSER          — в каком браузере запускать тесты.
#
#   PowerShell:  $env:COMPOSE_PROFILES="firefox"; $env:BROWSER="firefox"; docker compose up --build --exit-code-from qa-framework
#   bash:        COMPOSE_PROFILES=firefox BROWSER=firefox docker compose up --build --exit-code-from qa-framework
#
# Без COMPOSE_PROFILES узлы не стартуют, и Selenium-тесты упадут с понятной ошибкой
# (проверка готовности Grid в drivers/factory.py). Для локальной работы удобно прописать
# COMPOSE_PROFILES=chrome в .env — docker compose читает его сам.
#
# Grid UI (кто подключён, какие сессии идут): http://localhost:4444/ui/
# (4444 — порт по умолчанию, меняется переменной GRID_HOST_PORT; косая черта в конце обязательна)
# Останов: docker compose down

# Имя проекта задаёт префикс сети и тома (ilcarro-tests_video-data): стенды разных проектов
# на одной машине не делят общий том и сеть
name: ilcarro-tests

# Общие настройки узлов браузеров (YAML-якорь: подставляется в каждый узел через <<: *node)
x-node: &node
  shm_size: 2gb                      # браузерам нужна большая разделяемая память, иначе вкладки падают
  # По SIGTERM узел закрывает сессии и дописывает видео (ffmpeg финализирует mp4). По умолчанию
  # compose ждёт 10 с и добивает SIGKILL — узлы выходили с кодом 137, последнее видео могло
  # остаться битым. Это верхняя граница: узел, закончивший раньше, останавливается сразу
  stop_grace_period: 60s
  depends_on:
    - selenium-hub
  volumes:
    - video-data:/videos             # сюда узел пишет видео сессий
  environment:
    - SE_EVENT_BUS_HOST=selenium-hub # через шину событий хаба узел регистрируется в Grid
    - SE_NODE_GRID_URL=http://selenium-hub:4444
    # Запись видео встроена в образ узла. Файл: /videos/<id сессии>.mp4
    # (если тест не задаёт capability se:name). Отдельные видео-контейнеры не нужны
    - SE_RECORD_VIDEO=true
  deploy:
    # По 3 узла выбранного браузера — под 3 параллельных воркера pytest (-n 3).
    # Один узел = одна сессия: так стабильнее, и видео пишется ровно одной сессии
    replicas: 3

volumes:
  video-data:                        # общий том: узлы пишут видео, тесты прикладывают его к Allure

services:
  selenium-hub:
    image: selenium/hub:4.51.0-20261010
    ports:
      # Grid UI и подключение с хоста (локальный запуск с USE_GRID=true).
      # Порт хоста настраивается: два стенда на общем 4444 роняют друг друга.
      # Тесты внутри compose-сети ходят к хабу по имени selenium-hub:4444 — порт хоста на них не влияет
      - "${GRID_HOST_PORT:-4444}:4444"

  chrome:
    <<: *node
    image: selenium/node-chrome:4.51.0-20261010
    platform: linux/amd64
    profiles: [chrome]

  firefox:
    <<: *node
    image: selenium/node-firefox:4.51.0-20261010
    profiles: [firefox]

  edge:
    <<: *node
    image: selenium/node-edge:4.51.0-20261010
    platform: linux/amd64
    profiles: [edge]

  qa-framework:
    build: .
    depends_on:
      - selenium-hub                 # готовность хаба и узлов проверяет drivers/factory.py (/status Grid)
    volumes:
      - "./allure-results:/app/allure-results"
      - "video-data:/app/video"      # тот же том: тесты находят видео по id сессии
    environment:
      - USE_GRID=true
      - GRID_URL=http://selenium-hub:4444
      - VIDEO_DIR=/app/video
      - UI_BASE_URL=https://icarro-v1.netlify.app
      - API_BASE_URL=https://ilcarro-backend.herokuapp.com
      # Параметры запуска от CI или от тебя (см. шапку файла).
      # Если BROWSER не задан — chrome; если задан TEST_MARKER — фильтруем по нему, иначе все тесты
      - BROWSER=${BROWSER:-chrome}
      - TEST_MARKER=${TEST_MARKER:-}
      # Дополнительные аргументы pytest (pytest читает переменную сам). Через неё CI передаёт
      # выражение отбора -m как данные, а не вклеивает его в текст shell-команды
      - PYTEST_ADDOPTS=${PYTEST_ADDOPTS:-}
    command: >
      sh -c '
      if [ -n "$$TEST_MARKER" ]; then
        pytest tests/ -n 3 -m "$$TEST_MARKER" --browser_name=$${BROWSER:-chrome} --video=on --clean-alluredir --alluredir=allure-results;
      else
        pytest tests/ -n 3 --browser_name=$${BROWSER:-chrome} --video=on --clean-alluredir --alluredir=allure-results;
      fi
      '
