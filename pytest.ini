[pytest]
markers =
    smoke: Критический путь (основной позитивный функционал UI и API)
    regression: Полный регрессионный набор (негативные тесты, граничные значения, валидация)
    ui: Браузерные тесты пользовательского интерфейса (Selenium и Playwright)
    api: Тесты программного интерфейса бэкенда (Requests)
    hybrid: Гибридные тесты (API Precondition/Teardown + UI проверка)
    playwright: Современные быстрые UI-тесты на движке Playwright
    security: Проверки безопасности (токены, BOLA, идемпотентность, DoS, защита полей)
    contract: Валидация строгих JSON-схем и консистентности словарей
    mutation: Негативное DDT-тестирование методом лямбда-мутаций payload