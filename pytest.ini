[pytest]
# ---------- Логирование (файлы настраивает pytest_configure в conftest.py) ----------
# Что попадает в отчёт: "Captured log" упавших тестов и вложение "log" в Allure
log_level = INFO
log_format = %(asctime)s [%(levelname)-7s] %(name)s: %(message)s
log_date_format = %H:%M:%S

# Живые логи в консоли включает ENABLE_CONSOLE_LOGS=true (см. conftest.py).
# С xdist (-n) не работают: воркеры не выводят логи в консоль главного процесса.
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)-7s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Файл: отдельный на каждый воркер xdist. В файл пишем подробнее (DEBUG).
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)-7s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    smoke: Критический путь (основной позитивный функционал UI и API)
    regression: Полный регрессионный набор (негативные тесты, граничные значения, валидация)
    ui: Браузерные тесты пользовательского интерфейса (Selenium и Playwright)
    api: Тесты программного интерфейса бэкенда (Requests)
    hybrid: Гибридные тесты (API Precondition/Teardown + UI проверка)
    playwright: Современные быстрые UI-тесты на движке Playwright
    security: Проверки безопасности (токены, BOLA, идемпотентность, DoS, защита полей)
    contract: Валидация строгих JSON-схем и консистентности словарей
    mutation: Негативное DDT-тестирование методом лямбда-мутаций payload