[pytest]
markers =
    smoke: Базовые позитивные сценарии критического пути
    regression: Глубокие проверки, граничные значения и негативные тесты
    api: Все тесты, работающие напрямую с бэкендом (без UI)
    ui: Все тесты, поднимающие браузер
    security: Проверки авторизации, BOLA, идемпотентности и утечек данных
    hybrid: E2E тесты на стыке UI и API