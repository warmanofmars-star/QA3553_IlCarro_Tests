# Настройки инструментов разработки (ruff).
# Тесты настраиваются отдельно — в pytest.ini; инструменты ставятся из requirements-dev.txt (исходник — requirements-dev.in).

[tool.ruff]
# Нижняя граница совместимости, а не версия запуска: тесты идут на 3.14 (локально и в Docker),
# но код остаётся совместимым с 3.12+. Ruff не станет предлагать синтаксис, который сломается на 3.12.
target-version = "py312"
line-length = 120
# Где искать «свои» модули для сортировки импортов. research/ — отдельный корень:
# скрипты там импортируют соседний common.py как модуль верхнего уровня (через sys.path).
src = [".", "research"]
extend-exclude = ["allure-results", "allure-report", "logs", "test-results"]

[tool.ruff.lint]
# PLW1514 в ruff 0.17.1 — preview-правило: без preview его не включить. explicit-preview-rules
# ограничивает preview только правилами, названными в select поимённо, — остальные preview-правила
# и preview-поведение групп ниже не включаются.
preview = true
explicit-preview-rules = true
select = [
    "E", "W",   # pycodestyle: базовый стиль
    "F",        # pyflakes: неиспользуемые импорты и переменные, опечатки в именах
    "I",        # isort: порядок импортов
    "B",        # flake8-bugbear: типичные ошибки (изменяемые аргументы по умолчанию и т.п.)
    "UP",       # pyupgrade: современный синтаксис для нашей версии Python
    "SIM",      # flake8-simplify: код, который можно записать проще
    "PT",       # flake8-pytest-style: стиль тестов pytest
    "PLW1514",  # open()/read_text()/write_text() без encoding: на Windows по умолчанию не UTF-8
]

[tool.ruff.lint.flake8-pytest-style]
# Имена параметров в parametrize пишем строкой через запятую: "field, value"
parametrize-names-type = "csv"
