# Настройки gitleaks: хук pre-commit (.pre-commit-config.yaml) и job Lint в GitHub Actions.
#
# Встроенные правила ловят секреты с узнаваемой структурой: токены Telegram, GitHub, AWS,
# приватные ключи. Обычный пароль в формате .env (USER_PASSWORD=Qwerty123$) для них просто
# строка, поэтому добавлено своё правило.

[extend]
useDefault = true   # встроенные правила остаются, наше добавляется к ним

[[rules]]
id = "env-style-password"
description = "Пароль в формате переменной окружения: ...PASSWORD=значение"
# Строка, которая начинается с имени переменной, содержащего PASSWORD/PASSWD, и непустое значение.
# Допускаются отступ, «- » (список environment в docker-compose) и «export » (shell).
# Знак = — без пробелов вокруг, как в .env. Именно это отделяет .env от Python: ruff format
# ставит пробелы вокруг присваивания, и строка PASSWORD_CASES = [ правилом не ловится.
# В Phonebook правило с пробелами вокруг = поймало такой код; чинить надо правило, а не имя
# переменной. Секрет — значение после = (группа 1): по нему работают исключения ниже.
regex = '''(?m)^[ \t]*(?:-[ \t]*)?(?:export[ \t]+)?[A-Z0-9_]*PASSW(?:OR)?D[A-Z0-9_]*=(\S+)'''
secretGroup = 1
keywords = ["passw"]

  # Шаблон без настоящих значений — его коммитить можно и нужно
  [[rules.allowlists]]
  paths = ['''(^|/)\.env\.example$''']

  # Не секреты: заглушки из документации (USER_PASSWORD=your_secure_password — так было
  # в старом README) и подстановки переменных (${USER_PASSWORD} в compose или shell)
  [[rules.allowlists]]
  regexes = [
      '''(?i)^your[_-]''',
      '''^<[^>]*>$''',
      '''^\$\{''',
  ]
