# Проверки, которые автоматически запускаются перед каждым `git commit`.
#
# Установка (один раз на машине, после клонирования репозитория):
#     pip install -r requirements.txt -r requirements-dev.txt
#     pre-commit install
#
# Ручной запуск на всех файлах — обязателен перед коммитом (см. CLAUDE.md):
#     pre-commit run --all-files
#
# Если хук нашёл проблему, коммит не создаётся. Часть хуков исправляет файлы сама —
# тогда проверь изменения, снова сделай `git add` и повтори коммит. Обходить хуки
# через `git commit --no-verify` нельзя.
# Версии (rev) зафиксированы: обновлять их стоит осознанно, командой `pre-commit autoupdate`.
# Версия ruff — не здесь, а в requirements-dev.in (хуки ruff — local, см. ниже).

repos:
  # Базовая гигиена файлов
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace        # пробелы в конце строк
        # Markdown: два пробела в конце строки — это перенос строки, а не мусор
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer          # ровно один перевод строки в конце файла
      - id: check-yaml                 # синтаксис YAML: compose-файлы, workflow GitHub Actions
        # Только синтаксис, без разбора тегов: docker-compose.jenkins-build.yml использует
        # теги Compose !reset и !override, которых нет в стандартном YAML
        args: [--unsafe]
      - id: check-toml                 # синтаксис pyproject.toml и .gitleaks.toml
      - id: check-merge-conflict       # забытые маркеры конфликтов <<<<<<< / >>>>>>>
      - id: check-added-large-files    # случайно добавленные большие файлы (видео, дампы)
        args: [--maxkb=1024]

  # Линтер и форматтер Python (настройки — в pyproject.toml).
  # language: system — ruff берётся из текущего окружения, поставленного из lock-файла
  # requirements-dev.txt: единственный источник версии — requirements-dev.in (job Lint ставит
  # ruff оттуда же). Коммить из активированного venv, как и для хука coverage-matrix.
  # Поля хуков — как у astral-sh/ruff-pre-commit (entry с --force-exclude, types_or, require_serial)
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        args: [--fix]                  # исправимое — исправит сам, коммит всё равно остановится
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true

  # Конфиги GitHub — по JSON-схемам, встроенным в check-jsonschema (схемы лежат в пакете,
  # сеть не нужна). language: system, как у ruff: check-jsonschema — из venv, версия — только
  # в requirements-dev.in. Те же проверки — шаги job Lint
  - repo: local
    hooks:
      - id: check-dependabot
        name: validate Dependabot config against its schema
        entry: check-jsonschema --builtin-schema vendor.dependabot
        language: system
        files: ^\.github/dependabot\.yml$
      - id: check-github-workflows
        name: validate GitHub workflows against their schema
        entry: check-jsonschema --builtin-schema vendor.github-workflows
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

  # Поиск секретов в добавляемых изменениях: токены, ключи API, пароли в формате .env
  # (своё правило — в .gitleaks.toml, исторические находки — в .gitleaksignore)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1                       # единственный источник версии: job Lint читает её отсюда
    hooks:
      - id: gitleaks

  # Свои проверки проекта
  - repo: local
    hooks:
      # Относительные ссылки в Markdown ведут на существующие файлы и заголовки.
      # Только stdlib, поэтому language: python без зависимостей — отдельного окружения не нужно
      - id: check-links
        name: check relative links in Markdown
        entry: python scripts/check_links.py
        language: python
        types: [markdown]
      # Матрица трассируемости и сводка в README.md актуальны и согласованы с тегами тестов и реестрами.
      # language: system — хуку нужны зависимости проекта (pytest собирает тесты), поэтому он идёт
      # в текущем окружении, а не в отдельном окружении pre-commit: коммить из активированного venv
      - id: coverage-matrix
        name: traceability matrix is consistent and up to date
        entry: python scripts/coverage_matrix.py --check
        language: system
        pass_filenames: false
        # README.md и conftest.py — сверх tests/, data/ и docs/requirements/: в README лежит
        # сводка, а conftest.py влияет на сбор тестов
        files: ^(tests/|data/|docs/requirements/|scripts/coverage_matrix\.py$|conftest\.py$|README\.md$)
      # Английские переводы (*.en.md) согласованы с русскими оригиналами: отпечаток оригинала
      # в пометке translation-of, у requirements.en.md — те же ID, ссылки Q-…, код и статусы «Факта».
      # Запуск на любой .md: перевод устаревает от правки оригинала, а не от правки самого перевода.
      # language: system, как coverage-matrix: скрипт импортирует data/requirement_ids.py проекта
      - id: check-translations
        name: English translations match their originals
        entry: python scripts/check_translations.py
        language: system
        pass_filenames: false
        files: (\.md$|^scripts/check_translations\.py$|^data/requirement_ids\.py$)
