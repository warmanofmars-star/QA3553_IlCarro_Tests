name: IlCarro UI Tests

on:
  workflow_dispatch:

# РАЗРЕШАЕМ РОБОТУ ПИСАТЬ В РЕПОЗИТОРИЙ (Для создания ветки gh-pages)
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-22.04 # Фиксируем стабильную версию Linux для предсказуемости

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Pytest
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          UI_BASE_URL: "https://icarro-v1.netlify.app"
          API_BASE_URL: "https://ilcarro-backend.herokuapp.com"
          HEADLESS_MODE: "true"
        # Запускаем наши 3 потока с генерацией сырых данных Allure
        run: pytest tests/ -n 3 --clean-alluredir --reruns 2 --reruns-delay 2 --alluredir=allure-results
        continue-on-error: true

      # --- БЕЗОТКАЗНАЯ ГЕНЕРАЦИЯ ОТЧЕТА ЧЕРЕЗ NPM (БЕЗ DOCKER) ---
      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline --save-dev
          allure generate allure-results -o allure-report --clean

      # --- ПУБЛИКАЦИЯ СГЕНЕРИРОВАННОЙ ПАПКИ В GH-PAGES ---
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      # --- ОТПРАВКА УВЕДОМЛЕНИЯ В ТЕЛЕГРАМ ---
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        if: always()
        with:
            to: ${{ secrets.TELEGRAM_TO }}
            token: ${{ secrets.TELEGRAM_TOKEN }}
            message: |
              🤖 Автотесты IlCarro завершены!
              📊 Посмотреть Allure-отчет можно по ссылке:
              👉 https://warmanofmars-star.github.io/QA3553_IlCarro_Tests/