name: IlCarro UI Tests

on:
  workflow_dispatch: # Добавляет кнопку ручного запуска в интерфейсе GitHub

jobs:
  test:
    runs-on: ubuntu-latest # Поднимаем виртуальный сервер на Linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Edge (Headless)
        uses: browser-actions/setup-edge@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          # Забираем секреты из настроек репозитория
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          # Принудительно включаем невидимый режим для сервера
          HEADLESS_MODE: "true"
        run: pytest tests/ --clean-alluredir --alluredir=allure-results
        continue-on-error: true # Идем дальше, даже если тесты упали (чтобы собрать отчет)

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history